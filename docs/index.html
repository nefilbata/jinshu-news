<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金文动态 · JinWen News</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink:      #1a1208;
  --ink-2:    #3d3120;
  --ink-3:    #7a6a52;
  --ink-4:    #b0a090;
  --paper:    #faf7f2;
  --paper-2:  #f2ede4;
  --paper-3:  #e8e0d4;
  --accent:   #8b3a0f;
  --accent-2: #c4622a;
  --accent-pale: rgba(139,58,15,0.08);
  --accent-pale-2: rgba(139,58,15,0.15);
  --border:   rgba(90,70,40,0.12);
  --border-2: rgba(90,70,40,0.24);
  --serif: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
  --sans:  'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --timeline-line: rgba(139,58,15,0.18);
  --sidebar-w: 200px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--sans); background: var(--paper); color: var(--ink); font-size: 14px; line-height: 1.7; min-height: 100vh; }

header { border-bottom: 1px solid var(--border-2); background: var(--paper); position: sticky; top: 0; z-index: 200; backdrop-filter: blur(8px); }
.header-inner { max-width: 1200px; margin: 0 auto; padding: 0 28px; height: 52px; display: flex; align-items: center; gap: 16px; }
.logo { font-family: var(--serif); font-size: 17px; font-weight: 600; color: var(--ink); letter-spacing: 0.06em; text-decoration: none; display: flex; align-items: center; gap: 9px; white-space: nowrap; }
.logo-glyph { width: 28px; height: 28px; border: 1.5px solid var(--accent); border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--accent); font-family: var(--serif); font-weight: 600; }
.nav-tabs { display: flex; gap: 2px; margin-left: 12px; }
.nav-tab { font-size: 13px; font-family: var(--sans); color: var(--ink-3); background: none; border: none; padding: 5px 14px; border-radius: 5px; cursor: pointer; transition: all 0.15s; }
.nav-tab:hover { background: var(--paper-2); color: var(--ink-2); }
.nav-tab.active { background: var(--accent-pale-2); color: var(--accent); font-weight: 500; }
.header-search { margin-left: auto; position: relative; width: 220px; }
.header-search input { width: 100%; height: 32px; border: 1px solid var(--border-2); border-radius: 6px; padding: 0 10px 0 30px; font-size: 13px; font-family: var(--sans); background: var(--paper-2); color: var(--ink); outline: none; transition: border-color 0.15s; }
.header-search input:focus { border-color: var(--accent); background: var(--paper); }
.header-search-icon { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--ink-4); font-size: 14px; pointer-events: none; }
.header-meta { font-size: 11px; color: var(--ink-4); font-family: var(--serif); white-space: nowrap; }

.layout { max-width: 1200px; margin: 0 auto; padding: 20px 28px 80px; display: grid; grid-template-columns: var(--sidebar-w) 1fr; gap: 28px; align-items: start; }
.sidebar { position: sticky; top: 68px; }
.sidebar-section { margin-bottom: 22px; }
.sidebar-label { font-size: 10px; letter-spacing: 0.18em; color: var(--ink-4); text-transform: uppercase; font-family: var(--serif); margin-bottom: 8px; padding-bottom: 5px; border-bottom: 1px solid var(--border); }
.mini-stats { display: flex; flex-direction: column; gap: 6px; }
.mini-stat { display: flex; align-items: baseline; gap: 6px; }
.mini-stat-num { font-family: var(--serif); font-size: 18px; font-weight: 500; color: var(--ink); line-height: 1; }
.mini-stat-label { font-size: 11px; color: var(--ink-4); }

.source-item { font-size: 12px; color: var(--ink-3); padding: 4px 8px; display: flex; align-items: center; gap: 6px; border-radius: 4px; cursor: pointer; transition: background 0.12s; margin-bottom: 1px; }
.source-item:hover { background: var(--paper-2); color: var(--ink-2); }
.source-item.active { color: var(--accent); background: var(--accent-pale-2); }
.source-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--ink-4); flex-shrink: 0; }
.source-item.active .source-dot { background: var(--accent); }

.tag-cloud { display: flex; flex-wrap: wrap; gap: 4px; }
.tag-chip { font-size: 11px; font-family: var(--serif); color: var(--ink-3); border: 1px solid var(--border-2); padding: 1px 7px; border-radius: 3px; cursor: pointer; transition: all 0.12s; }
.tag-chip:hover { border-color: var(--accent-2); color: var(--accent-2); }
.tag-chip.active { border-color: var(--accent); color: var(--accent); background: var(--accent-pale-2); }

.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
.toolbar-count { font-family: var(--serif); font-size: 13px; color: var(--ink-3); flex: 1; }
.sort-btn { font-size: 12px; font-family: var(--sans); color: var(--ink-3); background: none; border: 1px solid var(--border-2); padding: 3px 11px; border-radius: 4px; cursor: pointer; transition: all 0.12s; }
.sort-btn:hover, .sort-btn.active { color: var(--accent); border-color: var(--accent); background: var(--accent-pale); }

.timeline { position: relative; }
.timeline::before { content: ''; position: absolute; left: 52px; top: 0; bottom: 0; width: 1px; background: var(--timeline-line); pointer-events: none; }
.day-header { display: flex; align-items: center; position: relative; }
.day-label { width: 52px; text-align: right; padding-right: 14px; flex-shrink: 0; }
.day-label-text { font-family: var(--serif); font-size: 12px; color: var(--ink-4); line-height: 1; display: block; }
.day-node { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; position: relative; z-index: 1; box-shadow: 0 0 0 3px var(--paper); }
.day-node-line { flex: 1; height: 1px; background: var(--border); margin-left: 10px; }
.day-articles { padding: 6px 0 16px 82px; display: flex; flex-direction: column; gap: 6px; }

.article-card { background: var(--paper); border: 1px solid var(--border); border-radius: 7px; padding: 13px 15px; transition: border-color 0.15s, background 0.15s, box-shadow 0.15s; position: relative; animation: slideIn 0.25s ease both; }
.article-card:hover { border-color: rgba(139,58,15,0.3); background: var(--paper-2); box-shadow: 0 2px 10px rgba(139,58,15,0.06); }
.article-card::before { content: ''; position: absolute; left: -30px; top: 50%; width: 20px; height: 1px; background: var(--border-2); }
.card-meta { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; flex-wrap: wrap; }
.source-badge { font-size: 11px; font-family: var(--serif); color: var(--accent); background: var(--accent-pale-2); padding: 1px 7px; border-radius: 3px; font-weight: 500; }
.cat-badge { font-size: 11px; color: var(--ink-4); background: var(--paper-3); padding: 1px 6px; border-radius: 3px; }
.card-date { font-size: 11px; color: var(--ink-4); font-family: var(--serif); margin-left: auto; }
.card-title { font-family: var(--serif); font-size: 14.5px; font-weight: 500; color: var(--ink); line-height: 1.55; margin-bottom: 5px; text-decoration: none; display: block; }
.card-title:hover { color: var(--accent); }
.card-summary { font-size: 12.5px; color: var(--ink-3); line-height: 1.6; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-footer { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.tag { font-size: 10.5px; color: var(--ink-4); border: 1px solid var(--border); padding: 0 6px; border-radius: 3px; font-family: var(--serif); cursor: pointer; }
.tag:hover { border-color: var(--accent-2); color: var(--accent-2); }
.card-author { font-size: 11px; color: var(--ink-4); font-family: var(--serif); }
.score-badge { margin-left: auto; font-size: 11px; font-family: var(--serif); color: var(--ink-4); display: flex; align-items: center; gap: 4px; }
.score-bar { width: 32px; height: 2.5px; background: var(--paper-3); border-radius: 2px; overflow: hidden; }
.score-fill { height: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); border-radius: 2px; }

.flat-list { display: flex; flex-direction: column; gap: 6px; }
.flat-list .article-card::before { display: none; }

.empty-state, .loading-state { text-align: center; padding: 80px 20px; color: var(--ink-4); font-family: var(--serif); }
.empty-glyph { font-size: 28px; margin-bottom: 12px; opacity: 0.35; }

.pagination { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 32px 0 0; }
.page-btn { font-size: 13px; font-family: var(--serif); color: var(--ink-2); background: none; border: 1px solid var(--border-2); padding: 4px 12px; border-radius: 4px; cursor: pointer; transition: all 0.12s; }
.page-btn:hover, .page-btn.active { color: var(--accent); border-color: var(--accent); background: var(--accent-pale); }
.page-btn:disabled { opacity: 0.3; cursor: not-allowed; }

@keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.article-card:nth-child(1){animation-delay:.03s} .article-card:nth-child(2){animation-delay:.06s} .article-card:nth-child(3){animation-delay:.09s} .article-card:nth-child(4){animation-delay:.12s} .article-card:nth-child(5){animation-delay:.15s}

@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; padding: 14px 14px 60px; }
  .sidebar { position: static; }
  .nav-tabs { display: none; }
  .header-search { width: 160px; }
  .timeline::before { left: 36px; }
  .day-label { width: 36px; padding-right: 10px; }
  .day-articles { padding-left: 60px; }
  .article-card::before { left: -20px; width: 14px; }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="logo" href="#"><div class="logo-glyph">金</div>金文动态</a>
    <nav class="nav-tabs">
      <button class="nav-tab active" data-cat="all">全部</button>
      <button class="nav-tab" data-cat="出土文献">出土文献</button>
      <button class="nav-tab" data-cat="考古文物">考古文物</button>
      <button class="nav-tab" data-cat="学术机构">学术机构</button>
    </nav>
    <div class="header-search">
      <span class="header-search-icon">⌕</span>
      <input type="text" id="search-input" placeholder="搜索标题、关键词…">
    </div>
    <div class="header-meta" id="update-time">加载中…</div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">数据概览</div>
      <div class="mini-stats">
        <div class="mini-stat"><span class="mini-stat-num" id="stat-total">—</span><span class="mini-stat-label">收录条目</span></div>
        <div class="mini-stat"><span class="mini-stat-num" id="stat-sources">—</span><span class="mini-stat-label">信息来源</span></div>
        <div class="mini-stat"><span class="mini-stat-num" id="stat-recent">—</span><span class="mini-stat-label">近7日新增</span></div>
      </div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">信源</div>
      <div id="source-list"></div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">标签</div>
      <div class="tag-cloud" id="tag-cloud"></div>
    </div>
  </aside>

  <main class="main-col">
    <div class="toolbar">
      <span class="toolbar-count" id="result-label">正在加载…</span>
      <button class="sort-btn active" data-sort="date">按时间</button>
      <button class="sort-btn" data-sort="score">按相关度</button>
    </div>
    <div id="article-list">
      <div class="loading-state"><div class="empty-glyph">⬡</div><div>正在连接数据库…</div></div>
    </div>
    <div class="pagination" id="pagination"></div>
  </main>
</div>

<script>
const SUPABASE_URL  = 'https://nhycnuxcrcwbrxmypshf.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5oeWNudXhjcmN3YnJ4bXlwc2hmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3MjU1MzEsImV4cCI6MjA5NDMwMTUzMX0.w0woFqSTADKFuU7stLB8m-uXCRTKny9pDOOZJ9Pd3xA';
const TABLE = 'jinshu_articles';

let allArticles = [], filtered = [];
let currentCat = 'all', currentSource = 'all', currentTag = 'all';
let sortMode = 'date', searchQuery = '', page = 1;
const PAGE_SIZE = 30;
let cachedRecentCount = 0;

function normalizeTitle(t) {
  return (t||'').replace(/[《》【】\[\]「」\s]/g,'').replace(/[——–—]/g,'-').toLowerCase().trim();
}

function dedup(arr) {
  const map = new Map();
  for (const a of arr) {
    const k = normalizeTitle(a.title);
    if (!k) continue;
    if (!map.has(k) || (a.score||0) > (map.get(k).score||0)) map.set(k, a);
  }
  return Array.from(map.values());
}

async function loadData() {
  const url = `${SUPABASE_URL}/rest/v1/${TABLE}?select=*&order=published_at.desc&limit=500`;
  const res = await fetch(url, { headers: { 'apikey': SUPABASE_ANON, 'Authorization': `Bearer ${SUPABASE_ANON}` } });
  if (!res.ok) throw new Error(`Supabase ${res.status}`);
  const data = await res.json();
  const articles = dedup(data);
  articles.sort((a,b) => new Date(b.published_at) - new Date(a.published_at));
  const ago7 = new Date(Date.now() - 7*864e5).toISOString();
  const recentCount = articles.filter(a => (a.fetched_at||a.published_at) >= ago7).length;
  return { articles, recentCount };
}

function fmt(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}

function dayKey(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '未知日期';
  const diff = Math.floor((Date.now() - d) / 864e5);
  if (diff === 0) return '今日';
  if (diff === 1) return '昨日';
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}

function applyFilters() {
  let arr = [...allArticles];
  if (currentCat    !== 'all') arr = arr.filter(a => a.category === currentCat);
  if (currentSource !== 'all') arr = arr.filter(a => a.source_id === currentSource);
  if (currentTag    !== 'all') arr = arr.filter(a => (a.tags||[]).includes(currentTag));
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    arr = arr.filter(a => (a.title||'').toLowerCase().includes(q) || (a.summary||'').toLowerCase().includes(q) || (a.author||'').toLowerCase().includes(q));
  }
  arr.sort(sortMode === 'score'
    ? (a,b) => (b.score||0)-(a.score||0)
    : (a,b) => new Date(b.published_at)-new Date(a.published_at));
  filtered = arr; page = 1;
}

function renderCard(a) {
  const pct  = Math.min(100, a.score||0);
  const tags = (a.tags||[]).slice(0,3).map(t=>`<span class="tag" data-tag="${t}">${t}</span>`).join('');
  const auth = a.author ? `<span class="card-author">${a.author.replace(/;+$/,'').replace(/;/g,'；')}</span>` : '';
  return `<div class="article-card">
    <div class="card-meta">
      <span class="source-badge">${a.source_short_name||a.source_name}</span>
      <span class="cat-badge">${a.category||''}</span>
      <span class="card-date">${fmt(a.published_at)}</span>
    </div>
    <a class="card-title" href="${a.link||'#'}" target="_blank" rel="noopener">${a.title}</a>
    ${a.summary?`<div class="card-summary">${a.summary}</div>`:''}
    <div class="card-footer">${auth}${tags}${a.score?`<div class="score-badge"><div class="score-bar"><div class="score-fill" style="width:${pct}%"></div></div>${a.score}</div>`:''}</div>
  </div>`;
}

function renderArticles() {
  const listEl = document.getElementById('article-list');
  const total  = filtered.length;
  const items  = filtered.slice((page-1)*PAGE_SIZE, page*PAGE_SIZE);
  document.getElementById('result-label').textContent = total === allArticles.length ? `共 ${total} 条资讯` : `筛选结果：${total} 条`;

  if (!items.length) {
    listEl.innerHTML = `<div class="empty-state"><div class="empty-glyph">𝌇</div><div>暂无相关资讯</div></div>`;
    renderPagination(total); return;
  }

  if (sortMode === 'date') {
    const groups={}, order=[];
    items.forEach(a => { const k=dayKey(a.published_at); if(!groups[k]){groups[k]=[];order.push(k);} groups[k].push(a); });
    listEl.innerHTML = `<div class="timeline">${order.map(k=>`
      <div class="day-group">
        <div class="day-header">
          <div class="day-label"><span class="day-label-text">${k}</span></div>
          <div class="day-node"></div><div class="day-node-line"></div>
        </div>
        <div class="day-articles">${groups[k].map(renderCard).join('')}</div>
      </div>`).join('')}</div>`;
  } else {
    listEl.innerHTML = `<div class="flat-list">${items.map(renderCard).join('')}</div>`;
  }
  renderPagination(total);
  listEl.querySelectorAll('.tag').forEach(el => el.addEventListener('click', () => filterTag(el.dataset.tag)));
}

function renderPagination(total) {
  const pages = Math.ceil(total/PAGE_SIZE);
  const el = document.getElementById('pagination');
  if (pages<=1){el.innerHTML='';return;}
  let h = `<button class="page-btn" onclick="goPage(${page-1})" ${page===1?'disabled':''}>← 上页</button>`;
  for(let i=1;i<=pages;i++){
    if(i===1||i===pages||Math.abs(i-page)<=1) h+=`<button class="page-btn ${i===page?'active':''}" onclick="goPage(${i})">${i}</button>`;
    else if(Math.abs(i-page)===2) h+=`<span style="color:var(--ink-4);padding:0 2px">…</span>`;
  }
  h+=`<button class="page-btn" onclick="goPage(${page+1})" ${page===pages?'disabled':''}>下页 →</button>`;
  el.innerHTML=h;
}

window.goPage = n => { page=n; renderArticles(); window.scrollTo({top:0,behavior:'smooth'}); };

function renderSidebar() {
  document.getElementById('stat-total').textContent  = allArticles.length;
  document.getElementById('stat-recent').textContent = cachedRecentCount;
  const sm={};
  allArticles.forEach(a=>{if(!sm[a.source_id])sm[a.source_id]={name:a.source_short_name||a.source_name,count:0,id:a.source_id};sm[a.source_id].count++;});
  document.getElementById('stat-sources').textContent = Object.keys(sm).length;
  document.getElementById('source-list').innerHTML =
    `<div class="source-item ${currentSource==='all'?'active':''}" onclick="filterSource('all')"><div class="source-dot"></div>全部信源</div>` +
    Object.values(sm).sort((a,b)=>b.count-a.count).slice(0,15).map(s=>
      `<div class="source-item ${currentSource===s.id?'active':''}" onclick="filterSource('${s.id}')"><div class="source-dot"></div>${s.name}<span style="margin-left:auto;font-size:10px;color:var(--ink-4)">${s.count}</span></div>`).join('');
  const tc={};
  allArticles.forEach(a=>(a.tags||[]).forEach(t=>{tc[t]=(tc[t]||0)+1;}));
  document.getElementById('tag-cloud').innerHTML = Object.entries(tc).sort((a,b)=>b[1]-a[1]).map(([t,c])=>
    `<span class="tag-chip ${currentTag===t?'active':''}" onclick="filterTag('${t}')">${t} <small style="opacity:.55">${c}</small></span>`).join('');
}

window.filterSource = id => { currentSource=id; applyFilters(); renderArticles(); renderSidebar(); };
window.filterTag    = t  => { currentTag=currentTag===t?'all':t; applyFilters(); renderArticles(); renderSidebar(); };

document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.nav-tab').forEach(tab => tab.addEventListener('click', () => {
    document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active'); currentCat=tab.dataset.cat;
    applyFilters(); renderArticles(); renderSidebar();
  }));
  document.querySelectorAll('.sort-btn').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.sort-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); sortMode=btn.dataset.sort;
    applyFilters(); renderArticles();
  }));
  let st;
  document.getElementById('search-input').addEventListener('input', e => {
    clearTimeout(st); st=setTimeout(()=>{ searchQuery=e.target.value.trim(); applyFilters(); renderArticles(); },300);
  });

  const now = new Date();
  document.getElementById('update-time').textContent =
    `${now.getMonth()+1}月${now.getDate()}日 ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')} 更新`;

  loadData().then(({articles, recentCount}) => {
    allArticles = articles; cachedRecentCount = recentCount;
    renderSidebar(); applyFilters(); renderArticles();
  }).catch(err => {
    document.getElementById('article-list').innerHTML =
      `<div class="empty-state"><div class="empty-glyph">⚠</div><div>数据加载失败<br><small>${err.message}</small></div></div>`;
  });
});
</script>
</body>
</html>
