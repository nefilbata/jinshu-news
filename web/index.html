<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金文动态 · JinWen News</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500&family=Source+Han+Sans+CN:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1208;
    --ink-2: #3d3120;
    --ink-3: #7a6a52;
    --ink-4: #b0a090;
    --paper: #faf7f2;
    --paper-2: #f2ede4;
    --paper-3: #e8e0d4;
    --accent: #8b3a0f;
    --accent-2: #c4622a;
    --accent-pale: #f5e8df;
    --border: rgba(90, 70, 40, 0.15);
    --border-2: rgba(90, 70, 40, 0.28);
    --serif: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
    --sans: 'Source Han Sans CN', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--sans);
    background: var(--paper);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.7;
    min-height: 100vh;
  }

  /* ── 顶栏 ─── */
  header {
    border-bottom: 1px solid var(--border-2);
    background: var(--paper);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-inner {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 24px;
    height: 52px;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .logo {
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 500;
    color: var(--ink);
    letter-spacing: 0.08em;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-glyph {
    width: 28px;
    height: 28px;
    border: 1.5px solid var(--accent);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: var(--accent);
    font-family: var(--serif);
  }

  .header-sep { flex: 1; }

  .header-meta {
    font-size: 12px;
    color: var(--ink-4);
    font-family: var(--serif);
  }

  /* ── 主布局 ─── */
  .layout {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 24px 60px;
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 32px;
    align-items: start;
  }

  /* ── 侧栏 ─── */
  .sidebar {
    position: sticky;
    top: 68px;
  }

  .sidebar-section { margin-bottom: 24px; }

  .sidebar-label {
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--ink-4);
    text-transform: uppercase;
    font-family: var(--serif);
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .filter-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    padding: 6px 10px;
    border-radius: 5px;
    font-size: 13px;
    font-family: var(--sans);
    color: var(--ink-2);
    cursor: pointer;
    transition: all 0.15s;
    margin-bottom: 2px;
  }

  .filter-btn:hover { background: var(--paper-2); }

  .filter-btn.active {
    background: var(--accent-pale);
    color: var(--accent);
    font-weight: 500;
  }

  .filter-count {
    float: right;
    font-size: 11px;
    color: var(--ink-4);
    background: var(--paper-3);
    padding: 1px 6px;
    border-radius: 10px;
    font-family: var(--serif);
  }

  .filter-btn.active .filter-count {
    background: rgba(139,58,15,0.12);
    color: var(--accent-2);
  }

  /* 信源列表 */
  .source-item {
    font-size: 12px;
    color: var(--ink-3);
    padding: 4px 8px;
    display: flex;
    align-items: center;
    gap: 6px;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.12s;
    margin-bottom: 1px;
  }

  .source-item:hover { background: var(--paper-2); color: var(--ink-2); }

  .source-item.active { color: var(--accent); background: var(--accent-pale); }

  .source-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--ink-4);
    flex-shrink: 0;
  }

  .source-item.active .source-dot { background: var(--accent); }

  /* ── 主内容 ─── */
  .main-col {}

  /* 顶部工具栏 */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }

  .toolbar-title {
    font-family: var(--serif);
    font-size: 13px;
    color: var(--ink-3);
    flex: 1;
  }

  .sort-btn {
    font-size: 12px;
    font-family: var(--sans);
    color: var(--ink-3);
    background: none;
    border: 1px solid var(--border-2);
    padding: 4px 12px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.12s;
  }

  .sort-btn:hover, .sort-btn.active {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--accent-pale);
  }

  /* ── 文章卡片 ─── */
  .article-list { display: flex; flex-direction: column; gap: 1px; }

  .article-card {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px 18px;
    transition: border-color 0.15s, background 0.15s;
    animation: fadeIn 0.3s ease both;
  }

  .article-card:hover {
    border-color: var(--border-2);
    background: var(--paper-2);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 7px;
    flex-wrap: wrap;
  }

  .source-badge {
    font-size: 11px;
    font-family: var(--serif);
    color: var(--accent);
    background: var(--accent-pale);
    padding: 2px 8px;
    border-radius: 3px;
    font-weight: 500;
  }

  .cat-badge {
    font-size: 11px;
    color: var(--ink-4);
    background: var(--paper-3);
    padding: 2px 7px;
    border-radius: 3px;
  }

  .card-date {
    font-size: 11px;
    color: var(--ink-4);
    font-family: var(--serif);
    margin-left: auto;
  }

  .card-title {
    font-family: var(--serif);
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
    line-height: 1.55;
    margin-bottom: 7px;
    text-decoration: none;
    display: block;
  }

  .card-title:hover { color: var(--accent); }

  .card-summary {
    font-size: 13px;
    color: var(--ink-3);
    line-height: 1.65;
    margin-bottom: 10px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-footer {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .tag {
    font-size: 11px;
    color: var(--ink-4);
    border: 1px solid var(--border);
    padding: 1px 7px;
    border-radius: 3px;
    font-family: var(--serif);
  }

  .score-badge {
    margin-left: auto;
    font-size: 11px;
    font-family: var(--serif);
    color: var(--ink-4);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .score-bar {
    width: 36px;
    height: 3px;
    background: var(--paper-3);
    border-radius: 2px;
    overflow: hidden;
  }

  .score-fill {
    height: 100%;
    background: var(--accent-2);
    border-radius: 2px;
    transition: width 0.3s;
  }

  /* 分组标题（按日期） */
  .day-group { margin-bottom: 4px; }

  .day-header {
    font-family: var(--serif);
    font-size: 12px;
    color: var(--ink-4);
    letter-spacing: 0.08em;
    padding: 10px 0 8px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .day-header::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* 空状态 */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-4);
    font-family: var(--serif);
  }

  .empty-glyph {
    font-size: 32px;
    margin-bottom: 12px;
    opacity: 0.4;
  }

  /* 加载态 */
  .loading {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-4);
    font-family: var(--serif);
    font-size: 13px;
  }

  /* 搜索框 */
  .search-wrap {
    position: relative;
    margin-bottom: 14px;
  }

  .search-input {
    width: 100%;
    border: 1px solid var(--border-2);
    border-radius: 5px;
    padding: 7px 10px 7px 32px;
    font-size: 13px;
    font-family: var(--sans);
    background: var(--paper);
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s;
  }

  .search-input:focus { border-color: var(--accent); }

  .search-icon {
    position: absolute;
    left: 9px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-4);
    font-size: 14px;
  }

  /* 统计栏 */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 24px;
  }

  .stat-card {
    background: var(--paper-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
  }

  .stat-num {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 500;
    color: var(--ink);
    line-height: 1;
    margin-bottom: 4px;
  }

  .stat-label {
    font-size: 11px;
    color: var(--ink-4);
    letter-spacing: 0.05em;
  }

  /* 分页 */
  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 32px 0 0;
  }

  .page-btn {
    font-size: 13px;
    font-family: var(--serif);
    color: var(--ink-2);
    background: none;
    border: 1px solid var(--border-2);
    padding: 5px 13px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.12s;
  }

  .page-btn:hover, .page-btn.active {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--accent-pale);
  }

  .page-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  @media (max-width: 720px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { position: static; }
  }
</style>
</head>

// ── 数据加载 ────────────────────────────────────────────────
let allArticles = [];
let filtered = [];
let currentCat = 'all';
let currentSource = 'all';
let currentTag = 'all';
let sortMode = 'date';
let searchQuery = '';
let page = 1;
const PAGE_SIZE = 20;

async function loadData() {
  try {

    const res = await fetch('./data.json');

    const json = await res.json();
    return json;
  } catch {
    // 开发/演示用：返回示例数据
    return getDemoData();
  }
}

        link: '#', author: '', summary: '《古文字研究》第三十五辑正式出版，收录甲骨文、金文及战国文字研究论文三十余篇，涵盖字形考释、文本解读及相关历史研究。',

      },
      {

        link: '#', author: '', summary: '就近期学界关于武王克商年代问题的新论点进行回应，重点梳理不同研究路径之间的分歧，并对若干关键证据的解读提出商榷。（据题推断）',
        score: 93, tags: ['历史年代', '先秦史', '金文考释'], published_at: day(6)
      },
    ]
  };
}

function formatDate(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}

function dayKey(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '未知日期';
  const now = new Date();
  const diff = Math.floor((now - d) / 86400000);
  if (diff === 0) return '今日';
  if (diff === 1) return '昨日';
  return `${d.getMonth()+1}月${d.getDate()}日`;
}

function applyFilters() {
  let arr = [...allArticles];
  if (currentCat !== 'all') arr = arr.filter(a => a.category === currentCat);
  if (currentSource !== 'all') arr = arr.filter(a => a.source_id === currentSource);
  if (currentTag !== 'all') arr = arr.filter(a => a.tags && a.tags.includes(currentTag));
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    arr = arr.filter(a =>
      (a.title||'').toLowerCase().includes(q) ||
      (a.summary||'').toLowerCase().includes(q) ||
      (a.author||'').toLowerCase().includes(q)
    );
  }
  if (sortMode === 'score') {
    arr.sort((a,b) => (b.score||0) - (a.score||0));
  } else {
    arr.sort((a,b) => new Date(b.published_at) - new Date(a.published_at));
  }
  filtered = arr;
  page = 1;
}

function renderArticles() {
  const listEl = document.getElementById('article-list');
  const label = document.getElementById('result-label');

  const total = filtered.length;
  const start = (page-1)*PAGE_SIZE;
  const end = Math.min(start+PAGE_SIZE, total);
  const pageItems = filtered.slice(start, end);

  label.textContent = total === allArticles.length
    ? `共 ${total} 条资讯`
    : `筛选结果：${total} 条`;

  if (!pageItems.length) {
    listEl.innerHTML = `<div class="empty-state"><div class="empty-glyph">𝌇</div><div>暂无相关资讯</div></div>`;
    renderPagination(total);
    return;
  }

  // 按日期分组（仅在按时间排序时）
  if (sortMode === 'date') {
    const groups = {};
    const groupOrder = [];
    pageItems.forEach(a => {
      const k = dayKey(a.published_at);
      if (!groups[k]) { groups[k] = []; groupOrder.push(k); }
      groups[k].push(a);
    });

    listEl.innerHTML = groupOrder.map(k => `
      <div class="day-group">
        <div class="day-header">${k}</div>
        <div class="article-list">${groups[k].map(renderCard).join('')}</div>
      </div>
    `).join('');
  } else {
    listEl.innerHTML = `<div class="article-list">${pageItems.map(renderCard).join('')}</div>`;
  }

  renderPagination(total);
}

function renderCard(a) {
  const scorePct = Math.min(100, a.score || 0);
  const tags = (a.tags||[]).slice(0,3).map(t =>
    `<span class="tag" data-tag="${t}">${t}</span>`
  ).join('');
  return `
  <div class="article-card">
    <div class="card-meta">
      <span class="source-badge">${a.source_short_name || a.source_name}</span>
      <span class="cat-badge">${a.category||''}</span>
      <span class="card-date">${formatDate(a.published_at)}</span>
    </div>
    <a class="card-title" href="${a.link||'#'}" target="_blank" rel="noopener">${a.title}</a>
    ${a.summary ? `<div class="card-summary">${a.summary}</div>` : ''}
    <div class="card-footer">
      ${tags}
      ${a.score ? `<div class="score-badge">
        <div class="score-bar"><div class="score-fill" style="width:${scorePct}%"></div></div>
        ${a.score}
      </div>` : ''}
    </div>
  </div>`;
}

function renderPagination(total) {
  const pages = Math.ceil(total / PAGE_SIZE);
  const el = document.getElementById('pagination');
  if (pages <= 1) { el.innerHTML=''; return; }

  let html = `<button class="page-btn" onclick="goPage(${page-1})" ${page===1?'disabled':''}>← 上页</button>`;
  for (let i=1; i<=pages; i++) {
    if (i===1||i===pages||Math.abs(i-page)<=1) {
      html += `<button class="page-btn ${i===page?'active':''}" onclick="goPage(${i})">${i}</button>`;
    } else if (Math.abs(i-page)===2) {
      html += `<span style="color:var(--ink-4);padding:0 2px">…</span>`;
    }
  }
  html += `<button class="page-btn" onclick="goPage(${page+1})" ${page===pages?'disabled':''}>下页 →</button>`;
  el.innerHTML = html;
}

window.goPage = (n) => { page = n; renderArticles(); window.scrollTo({top:0, behavior:'smooth'}); };

function renderSidebar() {
  // 计数
  const cnt = (cat) => cat==='all' ? allArticles.length : allArticles.filter(a=>a.category===cat).length;
  document.getElementById('cnt-all').textContent = cnt('all');
  document.getElementById('cnt-kgww').textContent = cnt('考古文物');
  document.getElementById('cnt-ctwx').textContent = cnt('出土文献');
  document.getElementById('cnt-xsjg').textContent = cnt('学术机构');

  // 信源列表
  const sourceMap = {};
  allArticles.forEach(a => {
    if (!sourceMap[a.source_id]) sourceMap[a.source_id] = { name: a.source_short_name || a.source_name, count: 0, id: a.source_id };
    sourceMap[a.source_id].count++;
  });
  const sources = Object.values(sourceMap).sort((a,b)=>b.count-a.count);
  document.getElementById('source-list').innerHTML =
    `<div class="source-item ${currentSource==='all'?'active':''}" onclick="filterSource('all')">
      <div class="source-dot"></div>全部信源
     </div>` +
    sources.map(s => `
      <div class="source-item ${currentSource===s.id?'active':''}" onclick="filterSource('${s.id}')">
        <div class="source-dot"></div>${s.name}
        <span style="margin-left:auto;font-size:11px;color:var(--ink-4)">${s.count}</span>
      </div>`).join('');

  // 标签云
  const tagCount = {};
  allArticles.forEach(a => (a.tags||[]).forEach(t => { tagCount[t]=(tagCount[t]||0)+1; }));
  const tags = Object.entries(tagCount).sort((a,b)=>b[1]-a[1]);
  document.getElementById('tag-cloud').innerHTML = tags.map(([t,c]) =>
    `<span class="tag" style="cursor:pointer;${currentTag===t?'background:var(--accent-pale);color:var(--accent);border-color:var(--accent)':''}"
     onclick="filterTag('${t}')">${t} <small style="opacity:.6">${c}</small></span>`
  ).join('');

  // 统计栏
  document.getElementById('stat-total').textContent = allArticles.length;
  document.getElementById('stat-sources').textContent = Object.keys(sourceMap).length;
  const week = allArticles.filter(a => (Date.now()-new Date(a.published_at))<7*86400000).length;
  document.getElementById('stat-recent').textContent = week;
}

// ── 事件绑定 ────────────────────────────────────────────────
window.filterSource = (id) => {
  currentSource = id;
  renderSidebar();
  applyFilters();
  renderArticles();
};

window.filterTag = (t) => {
  currentTag = currentTag === t ? 'all' : t;
  applyFilters();
  renderArticles();
  renderSidebar();
};

document.addEventListener('DOMContentLoaded', () => {
  // 分类过滤
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCat = btn.dataset.cat;
      applyFilters();
      renderArticles();
    });
  });

  // 排序
  document.querySelectorAll('.sort-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      sortMode = btn.dataset.sort;
      applyFilters();
      renderArticles();
    });
  });

  // 搜索
  let searchTimer;
  document.getElementById('search-input').addEventListener('input', e => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      searchQuery = e.target.value.trim();
      applyFilters();
      renderArticles();
    }, 300);
  });

  // 加载数据
  loadData().then(json => {
    allArticles = json.articles || [];
    const upd = json.updatedAt ? new Date(json.updatedAt) : new Date();
    document.getElementById('update-time').textContent =
      `更新于 ${upd.getMonth()+1}月${upd.getDate()}日 ${String(upd.getHours()).padStart(2,'0')}:${String(upd.getMinutes()).padStart(2,'0')}`;

    renderSidebar();
    applyFilters();
    renderArticles();
  }).catch(err => {
    document.getElementById('article-list').innerHTML =
      `<div class="empty-state"><div class="empty-glyph">⚠</div><div>数据加载失败<br><small>${err.message}</small></div></div>`;
  });
});
</script>
</body>
</html>
