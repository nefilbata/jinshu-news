name: 金文速递每日更新

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily:
    # Paused at the owner's request; retain history and manual entry for later restoration.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fetcher/package-lock.json

      - name: Install dependencies
        working-directory: ./fetcher
        run: npm ci

      - name: Test fetcher
        working-directory: ./fetcher
        run: npm test

      - name: Build digest without email, update archive
        working-directory: ./fetcher
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          EMAIL_ENABLED: 'false'
        run: npm run no-email

      - name: Commit archive updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data docs
          git diff --staged --quiet || git commit -m "chore: update jinshu digest $(date '+%Y-%m-%d')"
          git push
