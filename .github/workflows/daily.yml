name: 金文资讯 - 每日更新

on:
  schedule:
    # 每天早上 8:00 UTC+8（即 0:00 UTC）运行
    - cron: '0 0 * * *'
  # 允许手动触发
  workflow_dispatch:

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: fetcher/package.json

      - name: 安装依赖
        working-directory: ./fetcher
        run: npm install

      - name: 运行抓取并写入 Supabase
        working-directory: ./fetcher
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node index.js
